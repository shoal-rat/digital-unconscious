[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-unconscious"
version = "3.1.2"
description = "Watches where your attention goes, and at night dreams about what you didn't notice."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Digital Unconscious Contributors" }]
keywords = ["attention", "research", "ideas", "local-first", "claude-code", "codex", "quantified-self"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The engine runs on the standard library alone (sqlite3, urllib); the desktop app is Qt.
dependencies = ["PySide6-Essentials>=6.7"]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
anthropic = ["anthropic>=0.40"]
dev = ["ruff>=0.12", "build>=1.2"]
mac = ["pyinstaller>=6.10", "dmgbuild>=1.6"]  # scripts/build_mac.py: Digital Unconscious.app and its disk image

[project.urls]
Homepage = "https://github.com/shoal-rat/digital-unconscious"
Issues = "https://github.com/shoal-rat/digital-unconscious/issues"

[project.scripts]
dun = "unconscious.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unconscious = ["ui/fonts/*"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
