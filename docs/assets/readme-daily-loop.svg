<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Digital Unconscious daily loop</title>
  <desc id="desc">Screen or text signals become bounded notes, candidate connections, challenged ideas, and a daily brief.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a0e17"/><stop offset="1" stop-color="#11182a"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72e6c1"/><stop offset=".5" stop-color="#8b9cff"/><stop offset="1" stop-color="#d28cff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" fill="#eef2fb" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="750">A day becomes five useful decisions</text>
  <text x="54" y="87" fill="#929db8" font-family="Inter,Segoe UI,sans-serif" font-size="15">The raw stream stays out of long-term memory; only bounded artifacts move forward.</text>
  <path d="M150 205 H1050" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  <g font-family="Inter,Segoe UI,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 132)"><rect width="190" height="146" rx="20" fill="#151d2d" stroke="#28344e"/><circle cx="38" cy="38" r="18" fill="#72e6c1"/><text x="38" y="44" text-anchor="middle" fill="#08271f" font-size="16" font-weight="800">1</text><text x="24" y="84" fill="#eef2fb" font-size="18" font-weight="700">Observe</text><text x="24" y="110" fill="#929db8" font-size="13">vision · screenpipe · log</text></g>
    <g transform="translate(280 132)"><rect width="190" height="146" rx="20" fill="#151d2d" stroke="#28344e"/><circle cx="38" cy="38" r="18" fill="#70cce6"/><text x="38" y="44" text-anchor="middle" fill="#08212b" font-size="16" font-weight="800">2</text><text x="24" y="84" fill="#eef2fb" font-size="18" font-weight="700">Compress</text><text x="24" y="110" fill="#929db8" font-size="13">bounded working notes</text></g>
    <g transform="translate(505 132)"><rect width="190" height="146" rx="20" fill="#151d2d" stroke="#354066"/><circle cx="38" cy="38" r="18" fill="#8b9cff"/><text x="38" y="44" text-anchor="middle" fill="#151a3d" font-size="16" font-weight="800">3</text><text x="24" y="84" fill="#eef2fb" font-size="18" font-weight="700">Connect</text><text x="24" y="110" fill="#929db8" font-size="13">cross-domain questions</text></g>
    <g transform="translate(730 132)"><rect width="190" height="146" rx="20" fill="#151d2d" stroke="#3c355c"/><circle cx="38" cy="38" r="18" fill="#be92f2"/><text x="38" y="44" text-anchor="middle" fill="#28163d" font-size="16" font-weight="800">4</text><text x="24" y="84" fill="#eef2fb" font-size="18" font-weight="700">Challenge</text><text x="24" y="110" fill="#929db8" font-size="13">novel · feasible · timely</text></g>
    <g transform="translate(955 132)"><rect width="190" height="146" rx="20" fill="#151d2d" stroke="#49335b"/><circle cx="38" cy="38" r="18" fill="#e58fd7"/><text x="38" y="44" text-anchor="middle" fill="#3b1534" font-size="16" font-weight="800">5</text><text x="24" y="84" fill="#eef2fb" font-size="18" font-weight="700">Brief</text><text x="24" y="110" fill="#929db8" font-size="13">a shortlist worth reading</text></g>
  </g>
  <path d="M1050 304 C1050 350 902 362 724 362 H362 C211 362 150 339 150 304" fill="none" stroke="#34405d" stroke-width="2" stroke-dasharray="7 8"/>
  <rect x="442" y="337" width="316" height="46" rx="23" fill="#111a2a" stroke="#34405d"/>
  <text x="600" y="365" text-anchor="middle" fill="#9faac3" font-family="Inter,Segoe UI,sans-serif" font-size="13">bounded backlog · learning signals · next day</text>
</svg>
