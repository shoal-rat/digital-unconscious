<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Six-stage research dossier pipeline</title>
  <desc id="desc">Literature, feasibility, data, analysis, drafting, and review stages leave structured, readable, resumable artifacts.</desc>
  <defs><linearGradient id="pbg" x1="0" x2="1"><stop stop-color="#0b0f18"/><stop offset="1" stop-color="#11192b"/></linearGradient><linearGradient id="rail"><stop stop-color="#72e6c1"/><stop offset=".55" stop-color="#8b9cff"/><stop offset="1" stop-color="#e58fd7"/></linearGradient></defs>
  <rect width="1200" height="400" rx="28" fill="url(#pbg)"/>
  <text x="54" y="58" fill="#eef2fb" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="750">A dossier you can inspect at every stage</text>
  <text x="54" y="87" fill="#929db8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Structured artifacts make long runs resumable, debuggable, and reviewable.</text>
  <line x1="112" y1="190" x2="1088" y2="190" stroke="url(#rail)" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g transform="translate(60 142)"><circle cx="52" cy="48" r="44" fill="#15352d" stroke="#72e6c1"/><text x="52" y="55" text-anchor="middle" fill="#72e6c1" font-size="22" font-weight="800">01</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Literature</text></g>
    <g transform="translate(252 142)"><circle cx="52" cy="48" r="44" fill="#16303a" stroke="#70cce6"/><text x="52" y="55" text-anchor="middle" fill="#70cce6" font-size="22" font-weight="800">02</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Feasibility</text></g>
    <g transform="translate(444 142)"><circle cx="52" cy="48" r="44" fill="#1b2745" stroke="#8b9cff"/><text x="52" y="55" text-anchor="middle" fill="#8b9cff" font-size="22" font-weight="800">03</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Data</text></g>
    <g transform="translate(636 142)"><circle cx="52" cy="48" r="44" fill="#262440" stroke="#b18cf1"/><text x="52" y="55" text-anchor="middle" fill="#b18cf1" font-size="22" font-weight="800">04</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Analysis</text></g>
    <g transform="translate(828 142)"><circle cx="52" cy="48" r="44" fill="#34213a" stroke="#d28cff"/><text x="52" y="55" text-anchor="middle" fill="#d28cff" font-size="22" font-weight="800">05</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Draft</text></g>
    <g transform="translate(1020 142)"><circle cx="52" cy="48" r="44" fill="#3a2037" stroke="#e58fd7"/><text x="52" y="55" text-anchor="middle" fill="#e58fd7" font-size="22" font-weight="800">06</text><text x="52" y="122" text-anchor="middle" fill="#eef2fb" font-size="15" font-weight="700">Review</text></g>
    <rect x="282" y="314" width="636" height="46" rx="23" fill="#121b2b" stroke="#34415d"/>
    <text x="600" y="342" text-anchor="middle" fill="#a6b0c6" font-size="13">JSON contract · Markdown artifact · trace event · resume checkpoint</text>
  </g>
</svg>
