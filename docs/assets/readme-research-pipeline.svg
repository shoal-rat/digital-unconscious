<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous research pipeline stages</title>
  <desc id="desc">A six-stage research pipeline chart from literature review to peer review.</desc>
  <rect width="960" height="360" rx="18" fill="#111827"/>
  <text x="48" y="54" fill="#f9fafb" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">From promising idea to research dossier</text>
  <text x="48" y="84" fill="#b6bfce" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Top ideas can move into a staged run with artifacts, checkpoints, and a review loop.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <line x1="110" y1="160" x2="850" y2="160" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(80 124)">
      <circle cx="30" cy="36" r="30" fill="#38bdf8"/>
      <text x="30" y="41" text-anchor="middle" fill="#082f49" font-size="18" font-weight="800">1</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Literature</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">papers</text>
    </g>
    <g transform="translate(228 124)">
      <circle cx="30" cy="36" r="30" fill="#a78bfa"/>
      <text x="30" y="41" text-anchor="middle" fill="#2e1065" font-size="18" font-weight="800">2</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Feasibility</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">risks</text>
    </g>
    <g transform="translate(376 124)">
      <circle cx="30" cy="36" r="30" fill="#34d399"/>
      <text x="30" y="41" text-anchor="middle" fill="#064e3b" font-size="18" font-weight="800">3</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Data</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">sources</text>
    </g>
    <g transform="translate(524 124)">
      <circle cx="30" cy="36" r="30" fill="#fbbf24"/>
      <text x="30" y="41" text-anchor="middle" fill="#713f12" font-size="18" font-weight="800">4</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Analysis</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">figures</text>
    </g>
    <g transform="translate(672 124)">
      <circle cx="30" cy="36" r="30" fill="#fb7185"/>
      <text x="30" y="41" text-anchor="middle" fill="#881337" font-size="18" font-weight="800">5</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Draft</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">paper</text>
    </g>
    <g transform="translate(820 124)">
      <circle cx="30" cy="36" r="30" fill="#c4e94e"/>
      <text x="30" y="41" text-anchor="middle" fill="#365314" font-size="18" font-weight="800">6</text>
      <text x="30" y="92" text-anchor="middle" fill="#f9fafb" font-size="14" font-weight="700">Review</text>
      <text x="30" y="112" text-anchor="middle" fill="#b6bfce" font-size="12">revise</text>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="48" y="286" width="864" height="34" rx="17" fill="#172033" stroke="#2d3b57"/>
    <text x="76" y="308" fill="#dbeafe" font-size="13">Each stage writes structured JSON, a readable Markdown artifact, and trace entries for resume/debugging.</text>
  </g>
</svg>
