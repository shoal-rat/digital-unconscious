<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Workload-first model routing</title>
  <desc id="desc">Routine synthesis prefers economical DeepSeek; long-horizon analysis can use GLM; local Codex and Claude subscriptions provide the zero-key core.</desc>
  <defs><linearGradient id="bg2"><stop stop-color="#0b0f18"/><stop offset="1" stop-color="#11182a"/></linearGradient><linearGradient id="router" x1="0" x2="1"><stop stop-color="#72e6c1"/><stop offset=".52" stop-color="#8b9cff"/><stop offset="1" stop-color="#d28cff"/></linearGradient></defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg2)"/>
  <text x="54" y="58" fill="#eef2fb" font-family="Inter,Segoe UI,sans-serif" font-size="29" font-weight="750">Spend intelligence where it changes the answer</text>
  <text x="54" y="87" fill="#929db8" font-family="Inter,Segoe UI,sans-serif" font-size="15">Every preferred route has a transparent fallback. No key is a supported configuration.</text>
  <g font-family="Inter,Segoe UI,sans-serif">
