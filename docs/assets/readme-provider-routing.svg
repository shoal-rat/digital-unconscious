    <g transform="translate(890 132)"><rect width="254" height="116" rx="18" fill="#1e1b31" stroke="#6b55a0"/><text x="22" y="34" fill="#c29bf4" font-size="12" font-weight="750" letter-spacing="1.5">ZERO-KEY CORE</text><text x="22" y="65" fill="#eef2fb" font-size="20" font-weight="750">Claude Code</text><text x="22" y="91" fill="#aaa1c2" font-size="13">judge · write · revise</text></g>
