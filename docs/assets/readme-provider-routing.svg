    <g transform="translate(56 282)"><rect width="236" height="116" rx="18" fill="#192039" stroke="#45569a"/><text x="22" y="34" fill="#8b9cff" font-size="12" font-weight="750" letter-spacing="1.5">LONG HORIZON</text><text x="22" y="65" fill="#eef2fb" font-size="20" font-weight="750">GLM-5.1</text><text x="22" y="91" fill="#9aa4c8" font-size="13">analysis · engineering · planning</text></g>
    <path d="M310 190 H452 M310 340 H452" stroke="#42506f" stroke-width="3" stroke-linecap="round"/><path d="M452 190 l-10 -7 v14z M452 340 l-10 -7 v14z" fill="#667695"/>
    <g transform="translate(452 155)"><rect width="296" height="220" rx="28" fill="#131a28" stroke="url(#router)" stroke-width="2"/><circle cx="148" cy="70" r="38" fill="url(#router)" opacity=".95"/><path d="M130 70 h36 M148 52 v36" stroke="#101521" stroke-width="5" stroke-linecap="round"/><text x="148" y="132" text-anchor="middle" fill="#eef2fb" font-size="22" font-weight="780">Workload router</text><text x="148" y="160" text-anchor="middle" fill="#9aa5bf" font-size="13">availability · effort · fallback</text><rect x="66" y="181" width="164" height="24" rx="12" fill="#1f293d"/><text x="148" y="198" text-anchor="middle" fill="#b6c0d7" font-size="12">one AIBackend contract</text></g>
