# Digital Unconscious — Pipeline Configuration
# v2.0.0

[pipeline]
workspace_dir = "workspace"
quality_threshold = 78
auto_learn = true
network_timeout_seconds = 15
max_revisions = 3

[ai]
mode = "auto"                # zero-key default: Codex, then Claude Code
default_model = "sonnet"
# Workload-first routing. If an optional API key is absent, the local subscription
# CLIs take over automatically. Basic synthesis prefers economical DeepSeek V4;
# long-horizon and adversarial work uses Codex, Claude, or GLM.
creative_model = "codex:default"
judge_model = "claude_code:sonnet"
compressor_model = "deepseek:deepseek-v4-flash"
briefing_model = "deepseek:deepseek-v4-flash"
writer_model = "claude_code:opus"
reviewer_model = "codex:default"
revision_model = "claude_code:sonnet"
analysis_model = "glm:glm-5.1"
# api_key = ""               # prefer ANTHROPIC_API_KEY env var
# openai_api_key = ""        # prefer OPENAI_API_KEY env var
# kimi_api_key = ""          # prefer MOONSHOT_API_KEY or KIMI_API_KEY env var
# deepseek_api_key = ""       # prefer DEEPSEEK_API_KEY env var
# glm_api_key = ""            # prefer ZAI_API_KEY or GLM_API_KEY env var
openai_default_model = "gpt-5.6-sol"
kimi_default_model = "kimi-k2.6"
deepseek_default_model = "deepseek-v4-flash"
glm_default_model = "glm-5.1"
# Multi-provider failover: on a failed call, try the next available provider.
fallback = true
fallback_order = ["deepseek", "glm", "codex", "claude_code", "openai", "anthropic", "kimi"]
# Extended-thinking token budgets (0 disables). Adds deeper reasoning to the two
# reasoning-heavy steps; translated per provider (Anthropic thinking budget,
# OpenAI reasoning effort, Kimi thinking toggle, Claude Code think keyword).
think_idea_budget = 0
think_judge_budget = 0

[observation]
enabled = true
source = "auto"              # "auto" | "vision" | "screenpipe" | "file"
vision_model = "codex:default" # local Codex image input; falls back to Claude/API
vision_max_dimension = 1568  # downscale long edge before sending to the model
screenpipe_url = "http://localhost:3030"
window_minutes = 30
lookback_multiplier = 4
fallback_log_path = ""       # path to manual daily log file
service_interval_minutes = 60
recent_frame_hash_limit = 5000
# blacklist_apps = ["game", "video_player"]

[idea]
primary_domains = ["AI tools", "product design"]
secondary_domains = ["cognitive science", "business models"]
focus_fields = []                # e.g. ["economics research", "management"] — ideas must land in these fields
web_search = true                # let idea generation look up unfamiliar/trending topics online
max_ideas_per_cycle = 8
include_threshold = 75       # score > 75 goes into daily briefing
hold_threshold = 60          # score 60-75 goes to observation pool
max_briefing_ideas = 5
auto_research_enabled = true
auto_research_top_k = 1
auto_research_dedupe_enabled = true
auto_research_similarity_threshold = 0.9
auto_research_cooldown_days = 14

[literature]
max_results_per_source = 6
core_papers = 5
download_pdfs = true
max_pdf_downloads = 3

[datasets]
max_results_per_source = 5

[analysis]
max_categorical_values = 6
max_numeric_columns = 4
enable_ai_codegen = true
max_codegen_retries = 5
timeout_seconds = 120
figure_dpi = 300

[paper]
target_venue = "Research dossier"
final_submission_requires_approval = true

[learning]
min_runs_before_update = 1
prompt_evolution = true
human_idea_model = true
min_runs_before_evolution = 3

[daily]
max_ideas = 10
min_idea_score = 0.35
briefing_time = "22:00"

[circuit_breaker]
max_retries = 3
initial_wait = 2.0
failure_threshold = 5
recovery_timeout = 60.0

[credentials]
vault_path = "workspace/credentials/credentials.enc"
key_path = "workspace/credentials/master.key"

[automation]
enabled = true
auto_execute = false
runner = "claude_code"
checkpoint_policy = "best_effort" # "best_effort" (only stop when blocked) | "strict" (preemptive human checkpoints)
browser = "chrome"
download_dir = "workspace/browser_downloads"
screenshot_dir = "workspace/browser_screenshots"
headless = true
timeout_seconds = 60
institutional_proxy_url = ""

[submission]
enabled = true
approvals_path = "workspace/submissions"
pending_timeout_hours = 72

[service]
pid_path = "workspace/service/daemon.json"
log_path = "workspace/service/daemon.log"
status_path = "workspace/service/status.json"
run_history_limit = 200
gc_every_cycles = 24
maintenance_every_cycles = 24

[retention]
observation_days = 30
daily_cycle_days = 180
browser_artifact_days = 30
service_log_max_mb = 50
# Bounded long-term stores (enforced on write + by maintenance) so months of
# daily use cannot grow these files — or the prompts that draw on them — forever.
rag_max_documents = 2000        # cap RAG knowledge store size
idea_backlog_max = 500          # cap idea-backlog entries
domain_knowledge_history = 5    # shallow domain-knowledge snapshots kept
prompt_versions_kept = 10       # prompt-evolution version files per agent
evolution_log_max_lines = 500   # evolution_log.jsonl lines per agent
